<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeHeader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app" class="vh-container">
    <div class="vh-headerbar">
      <div class="vh-title"><img src="icons/icon32.png" alt="" width="18" height="18" />VibeHeader</div>
      <div class="vh-hb-actions">
        <button id="toggleBtn" class="vh-toggle" aria-pressed="false">
          <svg viewBox="0 0 24 24" class="vh-icon" fill="currentColor"></svg>
          <span>Resume</span>
        </button>
        <button id="shareBtn" class="vh-share" title="Copy link">
          <svg viewBox="0 0 24 24" class="vh-icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.828 10.172a4 4 0 010 5.656l-3 3a4 4 0 11-5.656-5.656l1.172-1.172"/>
            <path d="M10.172 13.828a4 4 0 010-5.656l3-3a4 4 0 115.656 5.656l-1.172 1.172"/>
          </svg>
          <span>Copy Link</span>
        </button>
      </div>
    </div>

    <!-- URL-pattern tabs: each tab owns its own header list; regex filters which URLs it applies to -->
    <div id="tabs" class="vh-tabs" role="tablist" aria-label="URL patterns"><!-- tabs --></div>
    <!-- Add/edit form appears on its own row under the tab chips -->
    <div id="tabFormHost" class="vh-tab-form-host" hidden></div>

    <div id="headers" class="vh-rows"><!-- rows --></div>

    <div class="vh-actions">
      <button id="addHeaderBtn" class="vh-link">+ Add header</button>
      <a id="feedbackLink" class="vh-feedback" target="_blank" rel="noopener" hidden>Feedback</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
